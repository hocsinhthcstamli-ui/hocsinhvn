<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FAF8F2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cùng Con" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/assets/icons/app-192.png" />
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
    <title>Cùng Con · Học tập & giao tiếp AAC</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/mobile.css" />
    <link rel="stylesheet" href="/artwork.css" />
  </head>
  <body>
    <div id="connection-status" role="status" hidden></div>
    <div id="app"><p class="loading">Đang mở Cùng Con…</p></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"></dialog>
    <div id="app-update" role="status" hidden>
      <span>Có bản cập nhật mới. Lưu công việc trước khi tải lại.</span
      ><button type="button">Tải bản mới</button>
    </div>
    <noscript>Vui lòng bật JavaScript để sử dụng ứng dụng.</noscript>
    <script type="module" src="/app.js"></script>
    <script type="module" src="/pwa.js"></script>
  </body>
</html>
