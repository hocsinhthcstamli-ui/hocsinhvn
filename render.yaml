services:
  - type: web
    name: cung-con-aac
    runtime: node
    region: singapore
    plan: free
    rootDir: apptuvanhoctap
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
